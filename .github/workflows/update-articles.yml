name: Update README
on:
  repository_dispatch:
    types: [posts-updated]

jobs:
  update-articles:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: e-motta/personal-website
          path: personal-website

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node scripts/generate-readme.mjs --posts-dir personal-website/posts --limit 5

      - name: Commit
        run: |
          if git diff --exit-code; then
              echo "No changes to commit."
              exit 0
          else
              git config user.name github-actions
              git config user.email github-actions@github.com
              git add .
              git commit -m "update"
              git push origin main
          fi
